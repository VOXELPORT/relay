<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>VoxelPort Admin</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">VP</span><span>VoxelPort <b>Admin</b></span></div>
    <div class="services" id="services" aria-label="Service health"></div>
    <div class="topbar-right">
      <span class="updated" id="updated">Loading…</span>
      <form method="post" action="/logout"><button class="btn ghost" type="submit">Sign out</button></form>
    </div>
  </header>

  <main class="page">
    <div class="alert" id="alert" hidden></div>

    <section class="kpis" id="kpis" aria-label="Right now"></section>

    <section class="block">
      <div class="block-head">
        <h2>Live activity</h2>
        <div class="seg" role="group" aria-label="Chart range">
          <button type="button" data-range="1h" aria-pressed="true">Last hour</button>
          <button type="button" data-range="24h" aria-pressed="false">24 hours</button>
          <button type="button" data-range="7d" aria-pressed="false">7 days</button>
          <button type="button" data-range="30d" aria-pressed="false">30 days</button>
          <button type="button" data-range="1y" aria-pressed="false">1 year</button>
          <button type="button" data-range="all" aria-pressed="false">All</button>
        </div>
      </div>
      <div class="charts">
        <figure class="chart-card"><figcaption>Players online</figcaption><div class="chart" id="ch-players"></div></figure>
        <figure class="chart-card"><figcaption>Relay traffic</figcaption><div class="chart" id="ch-relay"></div></figure>
        <figure class="chart-card"><figcaption>Home internet <span class="muted" id="iface-name"></span></figcaption><div class="chart" id="ch-net"></div></figure>
        <figure class="chart-card"><figcaption>CPU</figcaption><div class="chart" id="ch-cpu"></div></figure>
      </div>
    </section>

    <section class="block">
      <div class="block-head"><h2>Servers online</h2><span class="muted" id="ports-line"></span></div>
      <div class="table-wrap"><table class="table" id="tunnels"></table></div>
    </section>

    <div class="two-col">
      <section class="block">
        <div class="block-head"><h2>Website</h2><span class="muted">voxelport.in · page loads, no cookies</span></div>
        <div id="web"></div>
      </section>
      <section class="block">
        <div class="block-head"><h2>Downloads</h2></div>
        <div id="downloads"></div>
      </section>
    </div>

    <div class="two-col">
      <section class="block">
        <div class="block-head"><h2>Custom addresses</h2><span class="muted" id="names-count"></span></div>
        <div class="table-wrap"><table class="table" id="names"></table></div>
      </section>
      <section class="block">
        <div class="block-head"><h2>Machine</h2><span class="muted" id="hostname"></span></div>
        <div id="system"></div>
      </section>
    </div>

    <section class="block">
      <div class="block-head"><h2>Moderation</h2><span class="muted">Hidden server-list entries and blocked apps</span></div>
      <div class="two-col tight" id="moderation"></div>
    </section>
    <section class="block" id="saved">
      <div class="block-head"><h2>Saved data</h2><span class="muted" id="saved-usage"></span></div>
      <form class="export" id="export-form">
        <label for="ex-what">Data</label>
        <select id="ex-what">
          <option value="minutes">Live activity, every minute</option>
          <option value="metrics">Live activity, every 5 seconds (max 31 days)</option>
          <option value="hourly">Live activity, every hour</option>
          <option value="sessions">Server sessions</option>
          <option value="events">Events log</option>
          <option value="website">Website visits</option>
          <option value="downloads">Downloads per day</option>
        </select>
        <label for="ex-from">From</label><input id="ex-from" type="date">
        <label for="ex-to">To</label><input id="ex-to" type="date">
        <label for="ex-format">Format</label>
        <select id="ex-format"><option value="csv">CSV (Excel, Sheets)</option><option value="json">JSON</option></select>
        <button class="btn primary" type="submit">Download</button>
      </form>
      <div class="two-col">
        <div><h3 class="sub">Recent server sessions</h3><div class="table-wrap"><table class="table" id="sessions"></table></div></div>
        <div><h3 class="sub">Events</h3><div class="table-wrap"><table class="table" id="events"></table></div></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
